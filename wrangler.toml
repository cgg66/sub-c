name = "sub-c"
main = "_worker.js"
compatibility_date = "2024-09-01"

# ============ KV 命名空间(可选) ============
# KV 为可选绑定,用于在线编辑页;不绑定时使用环境变量 LINK 提供节点
# 需要时请在 Cloudflare 控制台 → 你的 Worker/Pages 项目 → 设置 → 绑定 中添加 KV 命名空间绑定,变量名必须为 KV

# ============ 环境变量 ============
# 所有变量请全部在 Cloudflare Pages 控制台 → 设置 → 环境变量 中配置
# 敏感变量(如 ADMIN_PASSWORD)请使用「加密变量/Secret」类型
# [vars]
# TOKEN = ""          # 必填,订阅入口路径,如 auto
# SUBAPI = ""         # 必填,订阅转换后端地址,如 sub.example.com
# SUBCONFIG = ""      # 可选,转换规则配置文件 URL,不配置使用内置 ACL4SSR 规则
# SUBNAME = "sub"     # 可选,订阅文件名,默认 sub
# SUBUPTIME = "6"     # 可选,更新间隔(小时),默认 6
# ADMIN_PASSWORD = "" # 可选,编辑页密码,建议使用 Secret/加密变量

# ============ 部署命令 ============
# 本地开发:  npx wrangler dev
# 部署:      npx wrangler deploy
# Pages 部署:连接 GitHub 仓库即可，无需手动 deploy
